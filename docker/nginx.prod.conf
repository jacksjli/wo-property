# WO Property Management System - Production Nginx Config
# 职责：
#   - 前端静态资源托管（带缓存）
#   - API 反向代理到 Gateway (5000) 和各微服务
#   - Gzip 压缩 + 安全头

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ============ Gzip 压缩 ============
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ============ 上游服务 ============
    upstream backend_gateway {
        server gateway:5000;
    }

    upstream frontend_app {
        server frontend:80;
    }

    # ============ HTTP Server ============
    server {
        listen 80;
        server_name localhost;

        # 安全头
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-XSS-Protection      "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy    "camera=(), microphone=(), geolocation=()" always;

        # 实际 IP 传递
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ============ 前端静态资源（带强缓存） ============
        location ~* \.(js|css|woff2?|ttf|eot|map)$ {
            proxy_pass         http://frontend_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # 长期缓存（文件名Hash版本化，理论上不会变）
            expires 1y;
            add_header Cache-Control "public, immutable";

            # 压缩
            gzip on;
            gzip_types application/javascript text/css;
        }

        # ============ 图片资源 ============
        location ~* \.(png|jpg|jpeg|gif|ico|webp|svg)$ {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public";
        }

        # ============ HTML（不缓存） ============
        location ~* \.html$ {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ============ API 统一走 Gateway ============
        location /api/ {
            proxy_pass         http://backend_gateway/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";

            # 超时
            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # WebSocket 支持（如有）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ============ 前端 SPA fallback ============
        location / {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection "";

            # SPA History 模式支持
            try_files $uri $uri/ /index.html;
        }

        # ============ 健康检查端点 ============
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
