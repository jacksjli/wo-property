# ============================================================
# Logstash Pipeline - WO-Property Logs
# Input: Beats (Filebeat) | Filter: JSON Parse | Output: ES
# ============================================================

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse JSON log lines
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    # Promote parsed fields to top level
    if [parsed] {
      mutate {
        rename => {
          "[parsed][timestamp]" => "log_timestamp"
          "[parsed][level]" => "log_level"
          "[parsed][traceId]" => "trace_id"
          "[parsed][serviceName]" => "service_name"
          "[parsed][message]" => "log_message"
          "[parsed][exception]" => "exception"
          "[parsed][context]" => "context"
          "[parsed][ElapsedMs]" => "elapsed_ms"
          "[parsed][Method]" => "http_method"
          "[parsed][Path]" => "http_path"
          "[parsed][StatusCode]" => "http_status_code"
        }
        remove_field => ["parsed", "message"]
      }
    }
  }

  # Normalize timestamp
  if [log_timestamp] {
    date {
      match => ["log_timestamp", "ISO8601", "yyyy-MM-ddTHH:mm:ss.SSSZ", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
      remove_field => ["log_timestamp"]
    }
  } else {
    # Use event time if no log timestamp
    date {
      match => ["@timestamp"]
      target => "@timestamp"
    }
  }

  # Add index routing based on service name
  if [service_name] {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "%{service_name}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "wo-property" }
    }
  }

  # Normalize log level
  if [log_level] {
    uppercase {
      source => "log_level"
      target => "log_level"
    }
  }

  # Add Kubernetes/Docker metadata if available
  if [docker][container][name] {
    mutate {
      add_field => { "container_name" => "%{docker.container.name}" }
    }
  }

  # Severity mapping for alerting
  if [log_level] in ["ERROR", "FATAL"] {
    mutate {
      add_tag => ["alert"]
      add_field => { "severity" => "high" }
    }
  } else if [log_level] == "WARN" {
    mutate {
      add_field => { "severity" => "medium" }
    }
  } else {
    mutate {
      add_field => { "severity" => "low" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://wo-elasticsearch:9200"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    ilm_enabled => true
    ilm_rollover_alias => "%{[@metadata][index_prefix]}"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "wo-property-logs-policy"
  }

  # Debug output (disable in production)
  # stdout { codec => rubydebug }
}