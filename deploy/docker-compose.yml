version: '3.8'

services:
  # ========== 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: wo-property-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wo_property}
      MYSQL_USER: ${MYSQL_USER:-woproperty}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-WOProperty2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wo-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 网关 ==========
  gateway:
    build:
      context: ../src
      dockerfile: WO.Property.GatewayService/Dockerfile
    container_name: wo-property-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-WO-Property-Management-Unified-Secret-Key-2026-For-All-Services}
      - JwtSettings__Issuer=wo-property-unified-auth
      - JwtSettings__Audience=wo-property-services
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== 认证服务 ==========
  auth-service:
    build:
      context: ../src
      dockerfile: WO.Property.AuthService/Dockerfile
    container_name: wo-property-auth
    restart: unless-stopped
    ports:
      - "5106:5106"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - CENTER_DB_CONNECTION_STRING=Server=mysql;Port=3306;Database=center_db;User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5106/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========== 工单服务 ==========
  ticket-service:
    build:
      context: ../src
      dockerfile: WO.Property.TicketService/Dockerfile
    container_name: wo-property-ticket
    restart: unless-stopped
    ports:
      - "5102:5102"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 人员服务 ==========
  person-service:
    build:
      context: ../src
      dockerfile: WO.Property.PersonService/Dockerfile
    container_name: wo-property-person
    restart: unless-stopped
    ports:
      - "5018:5018"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 主数据服务 ==========
  masterdata-service:
    build:
      context: ../src
      dockerfile: WO.Property.MasterDataService/Dockerfile
    container_name: wo-property-masterdata
    restart: unless-stopped
    ports:
      - "5019:5019"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 派工服务 ==========
  dispatch-service:
    build:
      context: ../src
      dockerfile: WO.Property.DispatchService/Dockerfile
    container_name: wo-property-dispatch
    restart: unless-stopped
    ports:
      - "5241:5241"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 通知服务 ==========
  notification-service:
    build:
      context: ../src
      dockerfile: WO.Property.NotificationService/Dockerfile
    container_name: wo-property-notification
    restart: unless-stopped
    ports:
      - "5505:5505"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 物料服务 ==========
  material-service:
    build:
      context: ../src
      dockerfile: WO.Property.MaterialService/Dockerfile
    container_name: wo-property-material
    restart: unless-stopped
    ports:
      - "5504:5504"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 设备服务 ==========
  device-service:
    build:
      context: ../src
      dockerfile: WO.Property.DeviceService/Dockerfile
    container_name: wo-property-device
    restart: unless-stopped
    ports:
      - "5530:5530"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 公告服务 ==========
  announcement-service:
