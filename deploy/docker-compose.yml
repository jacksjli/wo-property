    container_name: wo-property-announcement
    restart: unless-stopped
    ports:
      - "5511:5511"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 合同服务 ==========
  contract-service:
    build:
      context: ../src
      dockerfile: WO.Property.ContractService/Dockerfile
    container_name: wo-property-contract
    restart: unless-stopped
    ports:
      - "5501:5501"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 钥匙服务 ==========
  key-service:
    build:
      context: ../src
      dockerfile: WO.Property.KeyService/Dockerfile
    container_name: wo-property-key
    restart: unless-stopped
    ports:
      - "5512:5512"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 财务服务 ==========
  finance-service:
    build:
      context: ../src
      dockerfile: WO.Property.FinanceService/Dockerfile
    container_name: wo-property-finance
    restart: unless-stopped
    ports:
      - "5202:5202"
    depends_on:
      mysql:
        condition: service_healthy
