  # ========== 巡检服务 ==========
  inspection-service:
    build:
      context: ../src
      dockerfile: WO.Property.InspectionService/Dockerfile
    container_name: wo-property-inspection
    restart: unless-stopped
    ports:
      - "5507:5507"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 投诉服务 ==========
  complaint-service:
    build:
      context: ../src
      dockerfile: WO.Property.ComplaintService/Dockerfile
    container_name: wo-property-complaint
    restart: unless-stopped
