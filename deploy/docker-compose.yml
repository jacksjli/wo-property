      - "5201:5201"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wo-net
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 访客服务 ==========
  visitor-service:
    build:
      context: ../src
      dockerfile: WO.Property.VisitorService/Dockerfile
    container_name: wo-property-visitor
    restart: unless-stopped
