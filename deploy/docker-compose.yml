    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;

  # ========== 管理后台 (Vue) ==========
  admin-portal:
    build:
      context: ../src/admin-portal
      dockerfile: Dockerfile
    container_name: wo-property-admin
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway
    networks:
      - wo-net
    environment:
      - VITE_API_BASE=http://gateway:5000/api

  # ========== 小程序后端 API (Node) ==========
  mobile-api:
    build:
      context: ../src/woa-property-mini
      dockerfile: Dockerfile
    container_name: wo-property-mobile-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - wo-net
    environment:
      - API_BASE=http://gateway:5000/api

# ========== 网络 ==========
networks:
  wo-net:
    driver: bridge

# ========== 存储卷 ==========
volumes:
  mysql_data:
    driver: local