<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WO物业管理 - 前端测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 18px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .status-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .status-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .status-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 24px;
        }
        
        .icon-success {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }
        
        .icon-info {
            background: rgba(0, 123, 255, 0.1);
            color: #007bff;
        }
        
        .status-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .status-content {
            margin-top: 12px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .status-label {
            color: #666;
        }
        
        .status-value {
            font-weight: 500;
            color: #333;
        }
        
        .status-value.success {
            color: #28a745;
        }
        
        .test-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        .test-button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .test-button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .test-button.secondary {
            background: #6c757d;
            color: white;
        }
        
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .test-result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            display: none;
        }
        
        .test-result.show {
            display: block;
        }
        
        .result-success {
            color: #28a745;
        }
        
        .result-error {
            color: #dc3545;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">WO物业管理软件</h1>
            <p class="subtitle">前端开发环境测试页面</p>
        </div>
        
        <div class="status-grid">
            <div class="status-card">
                <div class="status-header">
                    <div class="status-icon icon-success">
                        ✓
                    </div>
                    <div class="status-title">后端服务状态</div>
                </div>
                <div class="status-content">
                    <div class="status-item">
                        <span class="status-label">认证与工单服务</span>
                        <span class="status-value success" id="auth-status">检查中...</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">设备管理服务</span>
                        <span class="status-value success" id="device-status">检查中...</span>
                    </div>
                </div>
            </div>
            
            <div class="status-card">
                <div class="status-header">
                    <div class="status-icon icon-info">
                        ⚙️
                    </div>
                    <div class="status-title">项目信息</div>
                </div>
                <div class="status-content">
                    <div class="status-item">
                        <span class="status-label">项目名称</span>
                        <span class="status-value">WO物业管理软件</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">技术栈</span>
                        <span class="status-value">.NET 10 + Vue 3 + SQLite</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">开发状态</span>
                        <span class="status-value success">后端服务已就绪</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">前端状态</span>
                        <span class="status-value" id="frontend-status">开发中</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="test-buttons">
            <button class="test-button primary" onclick="testAuthService()">
                测试认证服务
            </button>
            <button class="test-button primary" onclick="testDeviceService()">
                测试设备服务
            </button>
            <button class="test-button secondary" onclick="showDemoAccounts()">
                查看演示账户
            </button>
        </div>
        
        <div class="test-result" id="test-result"></div>
        
        <div class="footer">
            <p>© 2026 WO物业管理软件 - 开发版本 1.0.0</p>
            <p>后端服务运行在 localhost:5002 (认证) 和 localhost:5003 (设备)</p>
        </div>
    </div>
    
    <script>
        // 检查服务状态
        async function checkServiceStatus() {
            try {
                // 检查认证服务
                const authResponse = await fetch('http://localhost:5002/health');
                if (authResponse.ok) {
                    document.getElementById('auth-status').textContent = '运行正常 (5002)';
                    document.getElementById('auth-status').className = 'status-value success';
                } else {
                    document.getElementById('auth-status').textContent = '未运行';
                    document.getElementById('auth-status').className = 'status-value';
                }
            } catch (error) {
                document.getElementById('auth-status').textContent = '未运行';
                document.getElementById('auth-status').className = 'status-value';
            }
            
            try {
                // 检查设备服务
                const deviceResponse = await fetch('http://localhost:5003/health');
                if (deviceResponse.ok) {
                    const data = await deviceResponse.json();
                    document.getElementById('device-status').textContent = `运行正常 (5003) - ${data.service}`;
                    document.getElementById('device-status').className = 'status-value success';
                } else {
                    document.getElementById('device-status').textContent = '未运行';
                    document.getElementById('device-status').className = 'status-value';
                }
            } catch (error) {
                document.getElementById('device-status').textContent = '未运行';
                document.getElementById('device-status').className = 'status-value';
            }
        }
        
        // 测试认证服务
        async function testAuthService() {
            const resultDiv = document.getElementById('test-result');
            resultDiv.className = 'test-result show';
            resultDiv.innerHTML = '<p>正在测试认证服务...</p>';
            
            try {
                const response = await fetch('http://localhost:5002/health');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <p class="result-success">✅ 认证服务运行正常！</p>
                        <p>服务名称: ${data.service}</p>
                        <p>版本: ${data.version}</p>
                        <p>状态: ${data.status}</p>
                        <p>时间戳: ${new Date(data.timestamp).toLocaleString()}</p>
                    `;
                } else {
                    resultDiv.innerHTML = '<p class="result-error">❌ 认证服务未响应</p>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="result-error">❌ 连接认证服务失败: ${error.message}</p>`;
            }
        }
        
        // 测试设备服务
        async function testDeviceService() {
            const resultDiv = document.getElementById('test-result');
            resultDiv.className = 'test-result show';
            resultDiv.innerHTML = '<p>正在测试设备管理服务...</p>';
            
            try {
                const response = await fetch('http://localhost:5003/health');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <p class="result-success">✅ 设备管理服务运行正常！</p>
                        <p>服务名称: ${data.service}</p>
                        <p>版本: ${data.version}</p>
                        <p>状态: ${data.status}</p>
                        <p>时间戳: ${new Date(data.timestamp).toLocaleString()}</p>
                    `;
                } else {
                    resultDiv.innerHTML = '<p class="result-error">❌ 设备服务未响应</p>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="result-error">❌ 连接设备服务失败: ${error.message}</p>`;
            }
        }
        
        // 显示演示账户
        function showDemoAccounts() {
            const resultDiv = document.getElementById('test-result');
            resultDiv.className = 'test-result show';
            resultDiv.innerHTML = `
                <p><strong>演示账户信息：</strong></p>
                <div style="margin-top: 10px;">
                    <p><strong>管理员账户：</strong></p>
                    <p>用户名: admin</p>
                    <p>密码: Admin@123</p>
                    <p>权限: 完全控制权限</p>
                </div>
                <div style="margin-top: 10px;">
                    <p><strong>技术人员账户：</strong></p>
                    <p>用户名: tech</p>
                    <p>密码: Tech@123</p>
                    <p>权限: 工单和设备管理</p>
                </div>
                <div style="margin-top: 10px;">
                    <p><strong>普通用户账户：</strong></p>
                    <p>用户名: user</p>
                    <p>密码: User@123</p>
                    <p>权限: 查看和创建工单</p>
                </div>
                <p style="margin-top: 15px; color: #666; font-size: 14px;">
                    提示：点击上面的测试按钮可以直接测试服务连接。
                </p>
            `;
        }
        
        // 页面加载时检查服务状态
        window.onload = function() {
            checkServiceStatus();
            // 每30秒自动检查一次
            setInterval(checkServiceStatus, 30000);
        };
    </script>
</body>
</html>
