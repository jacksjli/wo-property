name: WO-Property CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0'
  NODE_VERSION: '20'
  PROJECT_ROOT: ${{ github.workspace }}/src

jobs:
  # =============================================================================
  # Job 1: 规范检查（编译前必须通过）
  # =============================================================================
  pre-check:
    name: 规范检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 获取子模块
        run: |
          git submodule update --init --recursive 2>/dev/null || true

      - name: 运行预检脚本
        run: |
          chmod +x scripts/pre-build-check.sh
          bash scripts/pre-build-check.sh

      - name: 上传检查结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pre-check-failure
          path: |
            scripts/pre-build-check.sh
          retention-days: 7

  # =============================================================================
  # Job 2: 后端服务编译
  # =============================================================================
  backend-build:
    name: 后端编译 (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: pre-check
    strategy:
      fail-fast: false
      matrix:
        service:
          - GatewayService
          - ContractService
          - TicketService
          - DeviceService
          - MaterialService
          - NotificationService
          - AccessControlService
          - PaymentService
          - FinanceService
          - InspectionService
          - AnnouncementService
          - KeyService
          - VisitorService
          - MobileService
          - PersonService
          - MasterDataService
          - CleaningService
          - RenovationService
          - CommunityService
          - ExpressService
          - ParkingService
    defaults:
      run:
        working-directory: ${{ env.PROJECT_ROOT }}/WO.Property.${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: |
          dotnet restore --verbosity minimal
          echo "=== Restore complete ==="

      - name: 编译
        run: |
          rm -rf bin obj
          dotnet build --configuration Release --no-restore -v n 2>&1 | tee /tmp/build.log
          echo "=== Build exit code: $? ==="
          cat /tmp/build.log | tail -30

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-dll-${{ matrix.service }}
          path: ${{ env.PROJECT_ROOT }}/WO.Property.${{ matrix.service }}/bin/Release/net8.0/*.dll
          retention-days: 3

  # =============================================================================
  # Job 3: 前端编译
  # =============================================================================
  frontend-build:
    name: 前端编译
    runs-on: ubuntu-latest
    needs: pre-check
    defaults:
      run:
        working-directory: ${{ env.PROJECT_ROOT }}/../admin-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装依赖
        run: npm ci 2>&1 | tail -20

      - name: 类型检查
        run: npm run type-check 2>/dev/null || true

      - name: 编译
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.PROJECT_ROOT }}/../admin-portal/dist
          retention-days: 3

  # =============================================================================
  # Job 4: 汇总（所有 job 必须成功）
  # =============================================================================
  ci-complete:
    name: CI 完成
    runs-on: ubuntu-latest
    needs: [pre-check, backend-build, frontend-build]
    if: always()
    steps:
      - name: 检查所有 job 状态
        run: |
          echo "pre-check: ${{ needs.pre-check.result }}"
          echo "backend-build: ${{ needs.backend-build.result }}"
          echo "frontend-build: ${{ needs.frontend-build.result }}"
          if [[ "${{ needs.pre-check.result }}" != "success" ]]; then
            echo "❌ 预检失败"
            exit 1
          fi
          if [[ "${{ needs.backend-build.result }}" != "success" ]]; then
            echo "❌ 后端编译失败"
            exit 1
          fi
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "❌ 前端编译失败"
            exit 1
          fi
          echo "✅ 所有检查通过"