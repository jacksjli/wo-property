name: 🔔 CD Trigger (手动审批流)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的镜像版本（Git SHA 或分支-SHA）'
        required: true
        default: ''
      environment:
        description: '目标环境 (staging/prod)'
        required: true
        default: 'prod'
      reason:
        description: '发布原因 / 备注'
        required: false
        default: ''

jobs:
  # =========================================================
  # Job 1: 生成发布申请单
  # =========================================================
  create-release-request:
    name: 📋 Create Release Request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="main-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "📦 Release version: $VER"

      - name: Print release summary
        run: |
          echo "=========================================="
          echo "  WO-Property CD Release Request"
          echo "=========================================="
          echo "  版本:     ${{ steps.version.outputs.version }}"
          echo "  环境:     ${{ github.event.inputs.environment }}"
          echo "  触发人:   @${{ github.actor }}"
          echo "  原因:     ${{ github.event.inputs.reason || '(未填写)' }}"
          echo "  时间:     ${{ github.event.created_at }}"
          echo "=========================================="

      # ── 打印部署说明 ──────────────────────────────────
      - name: 📋 Deployment instructions
        run: |
          echo "=========================================="
          echo "  CD 审批通过"
          echo "=========================================="
          echo "下一步："
          echo "  1. 如果 deploy.yml 的 SSH secrets 未配置，请先在 GitHub → Settings → Secrets 配置："
          echo "     - PROD_SERVER_HOST"
          echo "     - PROD_SERVER_USER"
          echo "     - PROD_SERVER_SSH_KEY"
          echo "  2. 然后在 Actions 页面手动 trigger deploy.yml"

  # =========================================================
  # Job 2: 触发实际部署 workflow
  # =========================================================
  trigger-deploy:
    name: 🚀 Trigger CD Deploy Workflow
    needs: create-release-request
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://${{ github.event.inputs.environment }}.wo-property.example.com

    steps:
      - name: 🚀 Dispatch deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                environment: '${{ github.event.inputs.environment }}',
                version: '${{ needs.create-release-request.outputs.version }}',
                service: 'all'
              }
            });
            console.log('✅ Deploy workflow triggered:', response.status);
